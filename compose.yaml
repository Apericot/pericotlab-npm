services:
  npm:
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: npm
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:81:81"

    environment:
      TZ: Europe/Paris

    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt

    networks:
      - proxy

networks:
  proxy:
    external: true
